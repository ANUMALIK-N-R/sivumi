name: Build Offline Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------------
      # 1. Get source
      # -------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # -------------------------------------------------------
      # 2. Java for Android / Gradle
      # -------------------------------------------------------
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          test -f "$ANDROID_HOME/platforms/android-36/android.jar"

          test -d "$ANDROID_HOME/build-tools/36.0.0"

          echo "Android API 36 installed successfully."

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;36.0.0"

      # -------------------------------------------------------
      # 4. Gradle 9.6
      # -------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      # -------------------------------------------------------
      # 5. Bun for React/Vite
      # -------------------------------------------------------
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # -------------------------------------------------------
      # 6. Install web dependencies
      # -------------------------------------------------------
      - name: Install web dependencies
        run: bun install

      # -------------------------------------------------------
      # 7. Build React / Vite application
      # -------------------------------------------------------
      - name: Build web application
        run: bun run build

      # -------------------------------------------------------
      # 8. Copy dist/ into Android assets
      # -------------------------------------------------------
      - name: Copy web assets into Android
        run: bun run android:assets

      # -------------------------------------------------------
      # 9. Download REAL Gemma 3 270M model
      #
      # Requires GitHub secret:
      # HF_TOKEN
      # -------------------------------------------------------
      - name: Install Hugging Face downloader
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub

      - name: Download Gemma 3 270M Q8 LiteRT model
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p android/app/src/main/assets/models

          python <<'PY'
          import os
          from huggingface_hub import hf_hub_download

          token = os.environ["HF_TOKEN"]

          path = hf_hub_download(
              repo_id="litert-community/gemma-3-270m-it",
              filename="gemma3-270m-it-q8.litertlm",
              token=token,
              local_dir="android/app/src/main/assets/models"
          )

          print("Downloaded model:")
          print(path)
          PY

      # -------------------------------------------------------
      # 10. Verify REAL model exists
      # -------------------------------------------------------
      - name: Verify Gemma model
        run: |
          MODEL="android/app/src/main/assets/models/gemma3-270m-it-q8.litertlm"

          if [ ! -f "$MODEL" ]; then
            echo "ERROR: Gemma model was not downloaded."
            exit 1
          fi

          SIZE=$(stat -c%s "$MODEL")

          echo "Gemma model size: $SIZE bytes"

          if [ "$SIZE" -lt 250000000 ]; then
            echo "ERROR: Model is too small."
            echo "Expected real Gemma 3 270M Q8 model."
            exit 1
          fi

          echo "Gemma model verified."

      # -------------------------------------------------------
      # 11. Build REAL Android Debug APK
      # -------------------------------------------------------
      - name: Build Android APK
        run: |
          gradle \
            --no-daemon \
            --non-interactive \
            -p android \
            assembleDebug

      # -------------------------------------------------------
      # 12. Find APK
      # -------------------------------------------------------
      - name: Locate APK
        run: |
          ls -lh android/app/build/outputs/apk/debug/

          test -f \
            android/app/build/outputs/apk/debug/app-debug.apk

      # -------------------------------------------------------
      # 13. Create requested directories
      # -------------------------------------------------------
      - name: Copy APK to requested locations
        run: |
          mkdir -p .build-outputs
          mkdir -p APK_DOWNLOAD

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            .build-outputs/app-debug.apk

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            APK_DOWNLOAD/app-debug.apk

      # -------------------------------------------------------
      # 14. Verify both APK copies are identical
      # -------------------------------------------------------
      - name: Verify APK copies
        run: |
          sha256sum \
            .build-outputs/app-debug.apk \
            APK_DOWNLOAD/app-debug.apk

          cmp \
            .build-outputs/app-debug.apk \
            APK_DOWNLOAD/app-debug.apk

      # -------------------------------------------------------
      # 15. Verify APK > 1 MB
      # -------------------------------------------------------
      - name: Verify APK size
        run: |
          APK="APK_DOWNLOAD/app-debug.apk"

          SIZE=$(stat -c%s "$APK")

          echo "APK size: $SIZE bytes"

          if [ "$SIZE" -le 1048576 ]; then
            echo "ERROR: APK is 1 MB or smaller."
            exit 1
          fi

          echo "APK size verification passed."

      # -------------------------------------------------------
      # 16. Verify APK is a valid ZIP/APK
      # -------------------------------------------------------
      - name: Verify APK structure
        run: |
          APK="APK_DOWNLOAD/app-debug.apk"

          unzip -t "$APK"

          unzip -l "$APK" | grep "AndroidManifest.xml"

          unzip -l "$APK" | grep -E \
            "classes([0-9]*)?\.dex"

          echo "APK archive verification passed."

      # -------------------------------------------------------
      # 17. Verify Android package metadata
      # -------------------------------------------------------
      - name: Verify Android package
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" \
            dump badging \
            APK_DOWNLOAD/app-debug.apk

      # -------------------------------------------------------
      # 18. Show final sizes
      # -------------------------------------------------------
      - name: Show final APK information
        run: |
          echo "=============================="
          echo "Final APK"
          echo "=============================="

          ls -lh \
            APK_DOWNLOAD/app-debug.apk \
            .build-outputs/app-debug.apk

          echo ""

          sha256sum APK_DOWNLOAD/app-debug.apk

      # -------------------------------------------------------
      # 19. Upload standalone APK
      # -------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sivumi-Gemma3-270M-APK
          path: APK_DOWNLOAD/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # -------------------------------------------------------
      # 20. Create complete project ZIP WITH APK
      # -------------------------------------------------------
      - name: Create project ZIP containing APK
        run: |
          zip -r \
            sivumi-gemma3-270m-with-apk.zip \
            . \
            -x ".git/*" \
            -x "node_modules/*" \
            -x "sivumi-gemma3-270m-with-apk.zip"

          ls -lh sivumi-gemma3-270m-with-apk.zip

      # -------------------------------------------------------
      # 21. Upload complete ZIP
      # -------------------------------------------------------
      - name: Upload complete project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sivumi-Gemma3-270M-Complete-Project
          path: sivumi-gemma3-270m-with-apk.zip
          if-no-files-found: error
          retention-days: 30
